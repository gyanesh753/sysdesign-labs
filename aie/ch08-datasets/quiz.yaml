questions:
  - id: data-centric
    type: single
    prompt: "Why is data where much of the leverage lies when building on foundation models?"
    options:
      - "Data is free"
      - "Training has become impossible"
      - "Everyone has access to similar base models, so the data you bring is what distinguishes your result"
      - "Models no longer matter at all"
    answer: C
    explanation: "When the strongest models are available to all, improving the model is not something most teams can do. Improving the data is."
    section: "Data sets the ceiling"

  - id: demonstrates
    type: single
    prompt: "You want a model to show its reasoning before answering. What must the training examples contain?"
    options:
      - "Only the final answers"
      - "Only the questions"
      - "Random text"
      - "The reasoning as well as the answers"
    answer: D
    explanation: "A dataset can only teach what it demonstrates. Examples with bare answers teach the model to give bare answers."
    section: "Data curation"

  - id: consistency
    type: single
    prompt: "Two annotators give different labels to the same input. Why is that a problem for training?"
    options:
      - "It doubles the dataset size"
      - "It only affects evaluation"
      - "The model is taught contradictory things for the same input"
      - "It makes training faster"
    answer: C
    explanation: "Inconsistent labels are noise the model cannot resolve. It usually points to a guideline that leaves the case undecided."
    section: "Quality"

  - id: start-small
    type: single
    prompt: "You finetune on 100 carefully made examples and see no improvement at all. What is the most reasonable conclusion?"
    options:
      - "Finetuning never works"
      - "The model is broken"
      - "Ten thousand examples of the same kind will certainly fix it"
      - "More of the same data is unlikely to help much; look at the data, the task framing or the base model"
    answer: D
    explanation: "A small, good dataset that produces some gain suggests more will help. No gain at all usually signals a problem that volume will not solve."
    section: "Quantity"

  - id: guideline
    type: single
    prompt: "What is usually the hardest part of labelling data by hand?"
    options:
      - "Finding a spreadsheet program"
      - "Counting the examples"
      - "Writing a guideline precise enough that different people label the same case the same way"
      - "Typing speed"
    answer: C
    explanation: "Defining what a good response is, including the awkward cases, is the real work. The same guideline then serves for evaluation."
    section: "Acquiring and annotating data"

  - id: reverse
    type: single
    prompt: "One synthesis method takes existing well-written text and has a model write the instruction it would answer. What is the advantage?"
    options:
      - "It produces more text per example"
      - "It removes the need for verification"
      - "No model is needed"
      - "The answers are written by people and of known quality; only the instruction is generated"
    answer: D
    explanation: "The risky part of generated data is usually the answer. Working backwards from trusted text keeps the answers trustworthy."
    section: "Generating with models"

  - id: verify
    type: single
    prompt: "A model generates code-writing examples for training. What is the most reliable way to check the answers?"
    options:
      - "Trust the generating model"
      - "Count the keywords"
      - "Run the code against tests"
      - "Check that each answer is long"
    answer: C
    explanation: "Where an answer can be executed, executing it is the strongest check. Fluency and length say nothing about correctness."
    section: "Verifying what was generated"

  - id: collapse
    type: single
    prompt: "What goes wrong when models are trained repeatedly on data generated by earlier models?"
    options:
      - "Training gets faster"
      - "Rare cases are under-represented a little more each round, until the variety in the data is gone"
      - "The models get larger"
      - "The tokenizer changes"
    answer: B
    explanation: "A model favours typical outputs. Training on those, generation after generation, narrows the distribution. Keeping real data in the mix counters it."
    section: "The limits of generated data"

  - id: dedup-threshold
    type: single
    prompt: "When removing near-duplicates by similarity, what happens if the threshold is set too loosely?"
    options:
      - "Exact copies are kept"
      - "Reworded copies are missed"
      - "Nothing is removed"
      - "Examples that are merely similar are deleted, costing the dataset its variety"
    answer: D
    explanation: "Too strict misses near-copies; too loose removes legitimate, distinct examples. The threshold should be set by looking at what it actually removes."
    section: "Data processing"

  - id: processing
    type: multi
    prompt: "Which of these belong to data processing before training?"
    options:
      - "Removing duplicates"
      - "Removing personal information and leftover markup"
      - "Reading a sample of examples yourself"
      - "Putting every example into the exact template the model expects"
    answer: [ A, B, C, D ]
    explanation: "Inspect, deduplicate, clean and format. A mistake in any of them is silent: training still runs, and the model is quietly worse."
    section: "Data processing"
